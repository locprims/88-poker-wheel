<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>88 Poker — Admin</title>
<style>body{font-family:Arial;background:#0a0a0a;color:#eee;max-width:760px;margin:auto;padding:24px}input,button{font-size:16px;padding:12px;margin:5px;border-radius:8px;border:1px solid #777}button{cursor:pointer}table{width:100%;border-collapse:collapse;margin-top:20px}td,th{border-bottom:1px solid #333;padding:9px;text-align:left}.ok{color:#e4bf66}</style></head><body>
<h1>88 Poker — Validation des tours</h1><p>Cette page est un outil administrateur minimal. Ne partagez jamais votre clé admin.</p>
<input id="key" type="password" placeholder="Clé admin"><br><input id="tid" inputmode="numeric" placeholder="Telegram ID du joueur"><button id="grant">Autoriser 1 tour</button><button id="refresh">Historique</button><p id="msg" class="ok"></p>
<table><thead><tr><th>Joueur</th><th>Gain</th><th>Date</th><th>Statut</th></tr></thead><tbody id="rows"></tbody></table>
<script>
const key=document.getElementById("key"),tid=document.getElementById("tid"),msg=document.getElementById("msg"),rows=document.getElementById("rows");
document.getElementById("grant").onclick=async()=>{let r=await fetch("/api/admin/grant",{method:"POST",headers:{"Content-Type":"application/json","X-Admin-Key":key.value},body:JSON.stringify({telegram_id:Number(tid.value)})});let d=await r.json();msg.textContent=r.ok?"1 tour autorisé pour "+d.telegram_id:"Erreur : "+(d.error||"inconnue")};
async function refresh(){let r=await fetch("/api/admin/spins",{headers:{"X-Admin-Key":key.value}}),d=await r.json();if(!r.ok){msg.textContent="Clé admin incorrecte";return}rows.innerHTML=d.map(x=>`<tr><td>${x.username?"@"+x.username:x.telegram_id}</td><td>${x.prize} $</td><td>${new Date(x.created_at).toLocaleString()}</td><td>${x.status}</td></tr>`).join("")}
document.getElementById("refresh").onclick=refresh;
</script></body></html>
