<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>88 Poker Admin</title>
<style>body{font-family:Arial;background:#090909;color:#eee;max-width:1100px;margin:auto;padding:22px}h1{color:#e7c36c}input,button{font-size:15px;padding:11px;border-radius:8px;border:1px solid #555;margin:3px}input{background:#161616;color:#fff;min-width:260px}button{cursor:pointer;background:#d9ae5a;font-weight:700}.wrap{overflow:auto}table{width:100%;border-collapse:collapse;margin-top:20px}th,td{padding:10px;border-bottom:1px solid #333;text-align:left;white-space:nowrap}.on{color:#ffe08a;font-weight:bold}#msg{color:#e7c36c}</style></head><body>
<h1>88 Poker — Gestion des tours</h1><p>Les joueurs apparaissent automatiquement après avoir ouvert la roulette Telegram.</p>
<input id="key" type="password" placeholder="ADMIN_KEY"><button id="load">Afficher les joueurs</button><button id="hist">Historique</button>
<input id="search" type="search" placeholder="🔎 Rechercher @pseudo, nom ou Telegram ID" autocomplete="off"><p id="msg"></p>
<div class="wrap"><table><thead id="head"></thead><tbody id="body"></tbody></table></div>
<script>
const key=document.querySelector("#key"),msg=document.querySelector("#msg"),head=document.querySelector("#head"),body=document.querySelector("#body"),search=document.querySelector("#search");
let cachedPlayers=[];
const H=()=>({"Content-Type":"application/json","X-Admin-Key":key.value});
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function renderPlayers(list){
head.innerHTML="<tr><th>Joueur</th><th>ID</th><th>Tour</th><th>Tours joués</th><th>Total gagné</th><th>Action</th></tr>";
body.innerHTML=list.map(x=>`<tr><td>${x.username?"@"+esc(x.username):esc(x.first_name)}</td><td>${x.telegram_id}</td><td class="${x.spins_available?"on":""}">${x.spins_available?"1 disponible":"0"}</td><td>${x.total_spins}</td><td>${x.total_won} $</td><td><button data-id="${x.telegram_id}" data-act="${x.spins_available?"revoke":"grant"}">${x.spins_available?"Retirer":"Autoriser 1 tour"}</button></td></tr>`).join("");
msg.textContent=list.length+" joueur(s) affiché(s)";
}
async function players(){let r=await fetch("/api/admin/players",{headers:H()}),d=await r.json();if(!r.ok){msg.textContent="Clé admin incorrecte";return}
cachedPlayers=d; search.value=""; renderPlayers(cachedPlayers);}
body.addEventListener("click",async e=>{let b=e.target.closest("button");if(!b)return;let path=b.dataset.act==="grant"?"/api/admin/grant":"/api/admin/revoke";await fetch(path,{method:"POST",headers:H(),body:JSON.stringify({telegram_id:Number(b.dataset.id)})});players()});
async function hist(){let r=await fetch("/api/admin/spins",{headers:H()}),d=await r.json();if(!r.ok){msg.textContent="Clé admin incorrecte";return}head.innerHTML="<tr><th>Joueur</th><th>ID</th><th>Gain</th><th>Date</th><th>Statut</th></tr>";body.innerHTML=d.map(x=>`<tr><td>${x.username?"@"+esc(x.username):esc(x.first_name)}</td><td>${x.telegram_id}</td><td>${x.prize} $</td><td>${new Date(x.created_at).toLocaleString()}</td><td>${esc(x.status)}</td></tr>`).join("");msg.textContent=d.length+" tirage(s)";}
search.addEventListener("input",()=>{
 const q=search.value.trim().toLowerCase().replace(/^@/,"");
 if(!q){renderPlayers(cachedPlayers);return}
 const filtered=cachedPlayers.filter(x=>
   String(x.telegram_id).includes(q) ||
   String(x.username||"").toLowerCase().includes(q) ||
   String(x.first_name||"").toLowerCase().includes(q)
 );
 renderPlayers(filtered);
});
document.querySelector("#load").onclick=players;document.querySelector("#hist").onclick=hist;
</script></body></html>
